name: Build and Publish Multi-Arch Docker Image

on:
    release:
        types: [published]

env:
    DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/beamside

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                platform:
                    - linux/amd64
                    - linux/arm64

        runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

        name: Build Docker image for ${{ matrix.platform }}

        steps:
            - name: Set PLATFORM_PAIR
              run: |
                  platform=${{ matrix.platform }}
                  echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
              with:
                  platforms: ${{ matrix.platform }}

            - name: Build and push image
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  platforms: ${{ matrix.platform }}
                  tags: |
                      ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}-${{ env.PLATFORM_PAIR }}
                      ${{ env.DOCKER_IMAGE }}:latest-${{ env.PLATFORM_PAIR }}
                  cache-from: type=gha,scope=${{ github.repository }}-${{ env.PLATFORM_PAIR }}
                  cache-to: type=gha,mode=max,scope=${{ github.repository }}-${{ env.PLATFORM_PAIR }}

            - name: Export digest
              run: |
                  mkdir -p /tmp/digests
                  echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ env.PLATFORM_PAIR }}"

            - name: Upload digest
              uses: actions/upload-artifact@v6
              with:
                  name: digests-${{ env.PLATFORM_PAIR }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

    merge:
        name: Create Multi-Arch Manifest
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Download digests
              uses: actions/download-artifact@v7
              with:
                  path: /tmp/digests
                  pattern: digests-*
                  merge-multiple: true

            - name: Create multi-arch manifest
              run: |
                  refs=()
                  for digest_file in /tmp/digests/*; do
                    refs+=("${{ env.DOCKER_IMAGE }}@$(cat "$digest_file")")
                  done

                  docker buildx imagetools create \
                    -t ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }} \
                    -t ${{ env.DOCKER_IMAGE }}:latest \
                    "${refs[@]}"

            - name: Inspect manifest
              run: docker buildx imagetools inspect ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}
