<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Beamside</title>
        <meta name="description" content="Present LaTeX Beamer slides with your notes on a second screen." />
        <meta name="theme-color" content="#3B3BC4" />
        <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
        <script>
            (function () {
                var theme = 'system';
                try {
                    var settings = JSON.parse(
                        localStorage.getItem('beamside-settings') ||
                            localStorage.getItem('beamerr-settings') ||
                            '{}'
                    );
                    if (settings.theme) theme = settings.theme;
                } catch (e) {}
                var dark =
                    theme === 'system'
                        ? window.matchMedia('(prefers-color-scheme: dark)').matches
                        : theme === 'dark';
                document.documentElement.classList.toggle('dark', dark);
            })();
        </script>
    </body>
</html>
