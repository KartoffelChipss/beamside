<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>beamerr</title>
      <script type="module" crossorigin src="/assets/index-DakylsPo.js"></script>
      <link rel="stylesheet" crossorigin href="/assets/index-DKu8hXET.css">
    <link rel="manifest" href="/manifest.webmanifest"></head>
    <body>
        <div id="root"></div>
        <script>
            (function () {
                var theme = 'system';
                try {
                    var settings = JSON.parse(localStorage.getItem('beamerr-settings') || '{}');
                    if (settings.theme) theme = settings.theme;
                } catch (e) {}
                var dark =
                    theme === 'system'
                        ? window.matchMedia('(prefers-color-scheme: dark)').matches
                        : theme === 'dark';
                document.documentElement.classList.toggle('dark', dark);
            })();
        </script>
    </body>
</html>
